; DIY RP2040 Zero with Waveshare LoRa module (SX1262)

[diy_rp2040_zero]
extends = rp2040_base
board = pico
board_build.filesystem_size = 0.5m
build_flags = ${rp2040_base.build_flags}
  -I variants/diy_rp2040_zero
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=9
  -D P_LORA_NSS=13 ; CS
  -D P_LORA_RESET=11
  -D P_LORA_BUSY=10
  -D P_LORA_SCLK=14
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=15
  -D P_LORA_TX_LED=7
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D PIN_ADVERT_BTN=2
  -D SX126X_REGISTER_Patch=1
; Debug options
  ; -D DEBUG_RP2040_WIRE=1
  ; -D DEBUG_RP2040_SPI=1
  ; -D DEBUG_RP2040_CORE=1
  ; -D RADIOLIB_DEBUG_SPI=1
  ; -D DEBUG_RP2040_PORT=Serial
build_src_filter = ${rp2040_base.build_src_filter}
  +<WaveshareBoard.cpp>
  +<../variants/diy_rp2040_zero>
lib_deps = ${rp2040_base.lib_deps}

[env:diy_rp2040_zero_repeater]
extends = diy_rp2040_zero
build_flags = ${diy_rp2040_zero.build_flags}
  -D ADVERT_NAME='"RP2040-LoRa Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${diy_rp2040_zero.build_src_filter}
  +<../examples/simple_repeater>


[env:diy_rp2040_zero_repeater_bridge_rs232]
extends = diy_rp2040_zero
build_flags = ${diy_rp2040_zero.build_flags}
  -D ADVERT_NAME='"RS232 Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_RS232_BRIDGE=Serial2
  -D WITH_RS232_BRIDGE_RX=9
  -D WITH_RS232_BRIDGE_TX=8
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${diy_rp2040_zero.build_src_filter}
  +<helpers/bridges/RS232Bridge.cpp>
  +<../examples/simple_repeater>

[env:diy_rp2040_zero_room_server]
extends = diy_rp2040_zero
build_flags = ${diy_rp2040_zero.build_flags}
  -D ADVERT_NAME='"RP2040-LoRa Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${diy_rp2040_zero.build_src_filter}
  +<../examples/simple_room_server>

[env:diy_rp2040_zero_companion_radio_usb]
extends = diy_rp2040_zero
build_flags = ${diy_rp2040_zero.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${diy_rp2040_zero.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${diy_rp2040_zero.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore =
  WiFi
  BLE

[env:diy_rp2040_zero_companion_radio_usb_fwd]
extends = diy_rp2040_zero
build_flags = ${diy_rp2040_zero.build_flags}
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=16
  -D ADVERT_NAME='"MMD"'
  -D WITH_SERIAL_FORWARD=Serial1
  -D WITH_SERIAL_FORWARD_TX=0
  -D WITH_SERIAL_FORWARD_RX=1
  -D WITH_SERIAL_FORWARD_DM=1
; Radio settings (first boot defaults, overridable via CLI at runtime)
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -D LORA_TX_POWER=22
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${diy_rp2040_zero.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/SerialForward.cpp>
lib_deps = ${diy_rp2040_zero.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore =
  WiFi
  BLE

